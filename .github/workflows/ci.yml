name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, tests, build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: chantierlink
          POSTGRES_PASSWORD: chantierlink
          POSTGRES_DB: chantierlink
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U chantierlink" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://chantierlink:chantierlink@localhost:5433/chantierlink
      APP_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-ci-secret
      CI: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create test databases
        run: |
          PGPASSWORD=chantierlink psql -h localhost -p 5433 -U chantierlink -d chantierlink \
            -c "CREATE DATABASE chantierlink_test" -c "CREATE DATABASE chantierlink_e2e"
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Integration tests
        run: pnpm test:integration
      - name: Build
        run: pnpm build
      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
